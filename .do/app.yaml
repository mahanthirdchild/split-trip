name: split-trip
region: fra
services:
  - name: web
    github:
      repo: mahanthirdchild/split-trip
      branch: main
      deploy_on_push: true
    dockerfile_path: Dockerfile
    http_port: 8080
    instance_count: 1
    instance_size_slug: basic-xxs
    health_check:
      http_path: /api/health
    envs:
      - key: DATA_DIR
        value: /data
        scope: RUN_TIME
    # NOTE: durable disk / managed DB is paid on DigitalOcean.
    # Without a volume, SQLite data may reset on redeploy/move.
